# TeleInject configuration file
# Lines beginning with # are comments. Format: KEY=VALUE
# This file is the persistent storage for all settings.

# ===== Telephony spoof values (used by hooks) =====
COUNTRY_ISO=
COUNTRY_CODE=
SIM_OPERATOR_NUMERIC=
SIM_OPERATOR=
SIM_OPERATOR_NAME=
SIM_COUNTRY_ISO=
NETWORK_COUNTRY_ISO=
NETWORK_OPERATOR_NUMERIC=
OPERATOR_NUMERIC=
OPERATOR_NAME=
MCC=
MCC_STRING=
MNC=
MNC_STRING=

# ===== Master switch =====
spoofTelephony=true

# ===== Per-class hook toggles =====
hookTelephonyManager=true
hookSubscriptionInfo=true
hookEmergencyNumber=true
hookTelephonyProperties=true
# FIX 1: was "hookSemSystemProperties" (wrong key, never read by pif_config.cpp)
hookSemTelephonyProps=true
# ULocale is disabled by default because mutating ICU internals can force-close apps.
hookULocale=false
hookCellIdentity=true

# ===== Allowed apps (comma-separated package names) =====
# Empty value means: apply to no app. Use the WebUI to manage this list.
allowedApps=

# ===== Misc =====
DEBUG=false
